name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  pull_request:

permissions:
  contents: write

jobs:
  build-windows:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Read the app version
        id: appver
        shell: bash
        run: echo "version=$(python -c 'import version; print(version.VERSION)')" >> "$GITHUB_OUTPUT"

      - name: Build Grokbot Voice
        run: pyinstaller --noconfirm --onefile --noconsole --name "Grokbot Voice" --icon grokbot_voice.ico --add-data "grokbot_voice.ico;." --collect-all uiautomation --collect-all piper --collect-all onnxruntime --hidden-import comtypes.stream --hidden-import platform_win --hidden-import grok_store --hidden-import audio_util --hidden-import version --hidden-import bot_prefs grok_voice.py

      - name: Attach the executable to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Grokbot Voice v${{ steps.appver.outputs.version }}
          fail_on_unmatched_files: true
          files: |
            dist/Grokbot Voice.exe

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common ca-certificates wget file binutils libfuse2
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y python3.12 python3.12-venv python3.12-dev python3.12-tk shellcheck xvfb

      - name: Create a virtualenv and install Python packages
        run: |
          python3.12 -m venv /tmp/venv
          /tmp/venv/bin/pip install --upgrade pip
          /tmp/venv/bin/pip install -r requirements-linux.txt

      - name: Check the Mint installer
        run: |
          shellcheck install-mint.sh
          bash install-mint.sh --dry-run
          # No controlling terminal: opening /dev/tty must not abort the script.
          setsid bash install-mint.sh --dry-run

      - name: Start the app headless
        run: GROKBOT_VOICE_SELFTEST=1 xvfb-run -a /tmp/venv/bin/python grok_voice.py

      - name: Run the Mint installer under Xvfb
        run: |
          rm -rf /tmp/mint-home
          mkdir -p /tmp/mint-home
          HOME=/tmp/mint-home XDG_CONFIG_HOME=/tmp/mint-home/.config XDG_CACHE_HOME=/tmp/mint-home/.cache \
            GROKBOT_VOICE_AUTOSTART=0 xvfb-run -a bash install-mint.sh
          test -x /tmp/mint-home/.local/bin/grokbot-voice
          test -x /tmp/mint-home/.config/grokbot-voice/piper/piper
          test -s /tmp/mint-home/.config/grokbot-voice/piper/en_GB-jenny_dioco-medium.onnx
          test -s /tmp/mint-home/.config/grokbot-voice/piper/en_US-amy-medium.onnx
          test -s /tmp/mint-home/.config/grokbot-voice/piper/en_US-lessac-medium.onnx
          test -s /tmp/mint-home/.local/share/applications/grokbot-voice.desktop
          desk="$(HOME=/tmp/mint-home xdg-user-dir DESKTOP 2>/dev/null || true)"
          if [ -z "$desk" ] || [ "$desk" = /tmp/mint-home ]; then desk=/tmp/mint-home/Desktop; fi
          test -x "$desk/grokbot-voice.desktop"

      - name: Read the app version
        id: appver
        run: echo "version=$(/tmp/venv/bin/python -c 'import version; print(version.VERSION)')" >> "$GITHUB_OUTPUT"

      - name: Test the chat reader
        run: /tmp/venv/bin/python -m unittest discover -s tests -v

      - name: Build the Linux binary
        run: |
          /tmp/venv/bin/pyinstaller --noconfirm --onefile --noconsole --name grokbot-voice \
            --add-data "assets/icon.png:." \
            --hidden-import platform_linux --hidden-import grok_store --hidden-import audio_util \
            --hidden-import version --hidden-import bot_prefs \
            --collect-all keyring --collect-all secretstorage --collect-all pynput \
            grok_voice.py
          cp dist/grokbot-voice dist/grokbot-voice-linux-x86_64
          chmod +x dist/grokbot-voice dist/grokbot-voice-linux-x86_64
          file dist/grokbot-voice-linux-x86_64

      - name: Download appimagetool
        run: |
          wget -q -O /tmp/appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x /tmp/appimagetool

      - name: Build the AppImage
        run: |
          chmod +x packaging/linux/build-appimage.sh
          APPIMAGETOOL=/tmp/appimagetool packaging/linux/build-appimage.sh
          file dist/Grokbot-Voice-x86_64.AppImage

      - name: Upload the Linux builds
        uses: actions/upload-artifact@v4
        with:
          name: grokbot-voice-linux
          path: |
            dist/grokbot-voice-linux-x86_64
            dist/Grokbot-Voice-x86_64.AppImage

      - name: Attach the Linux builds to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Grokbot Voice v${{ steps.appver.outputs.version }}
          fail_on_unmatched_files: true
          files: |
            dist/Grokbot-Voice-x86_64.AppImage
            dist/grokbot-voice-linux-x86_64
