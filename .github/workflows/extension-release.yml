name: Extension release

on:
  push:
    tags:
      - "ext-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read the extension version
        id: extver
        run: |
          version=$(python3 -c 'import json; print(json.load(open("chrome-extension/manifest.json"))["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          tag="${GITHUB_REF_NAME#ext-v}"
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi

      - name: Pack the extension
        run: |
          stage=$(mktemp -d)
          mkdir -p "$stage/pack"
          cp chrome-extension/manifest.json chrome-extension/popup.html chrome-extension/popup.js chrome-extension/popup.css chrome-extension/README.md "$stage/pack/"
          cp -R chrome-extension/src chrome-extension/icons "$stage/pack/"
          (cd "$stage/pack" && zip -r "$GITHUB_WORKSPACE/Grok-Voice-Reader-Extension.zip" .)
          unzip -l Grok-Voice-Reader-Extension.zip
          if unzip -l Grok-Voice-Reader-Extension.zip | grep -E 'node_modules/|/test/|package-lock.json'; then
            echo "Zip contains files that should stay out of the release"
            exit 1
          fi

      - name: Publish only when this tag is already on main
        id: gate
        run: |
          git fetch origin main --depth=100
          if git merge-base --is-ancestor HEAD origin/main; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "This tag is not on main, so the release stays a draft for testing."
          fi

      - name: Publish the extension release
        if: steps.gate.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: Browser Extension ${{ steps.extver.outputs.version }} (Chrome, Edge, Brave)
          tag_name: ${{ github.ref_name }}
          # The desktop updater reads /releases/latest. Leave this false so an
          # extension tag does not replace the desktop app's Latest release.
          make_latest: false
          files: Grok-Voice-Reader-Extension.zip
          body: |
            Browser extension that reads a new Grok reply aloud in the open tab.
            Unzip this file and load the folder in Chrome, Edge, or Brave. The steps are in the README inside the zip.
            This is the latest extension release. It does not include the desktop app.
